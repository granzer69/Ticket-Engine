name: CI

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ticketdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Unit tests
        run: |
          go test ./...
          go test -race ./...
      - name: Seed inventory
        env:
          MYSQL_HOST: 127.0.0.1:3306
          MYSQL_USER: root
          MYSQL_PASSWORD: root
          MYSQL_DATABASE: ticketdb
          REDIS_HOST: 127.0.0.1:6379
        run: go run . seed
      - name: Start persist worker
        env:
          MYSQL_HOST: 127.0.0.1:3306
          MYSQL_USER: root
          MYSQL_PASSWORD: root
          MYSQL_DATABASE: ticketdb
          REDIS_HOST: 127.0.0.1:6379
        run: |
          go run . worker &
          echo $! > /tmp/ticket-worker.pid
      - name: Integration tests
        env:
          MYSQL_HOST: 127.0.0.1:3306
          MYSQL_USER: root
          MYSQL_PASSWORD: root
          MYSQL_DATABASE: ticketdb
          REDIS_HOST: 127.0.0.1:6379
        run: go test -tags=integration ./integration/...
      - name: Stop persist worker
        if: always()
        run: kill "$(cat /tmp/ticket-worker.pid)" 2>/dev/null || true
